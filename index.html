<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon Quotidien</title>
  <meta name="description" content="Calendrier, séances de sport et rappels de la journée.">
  <meta name="theme-color" content="#12151c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quotidien">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/icon-192.png" alt=""> Mon Quotidien</div>
    <button class="icon-btn" data-settings aria-label="Réglages">⚙️</button>
  </header>

  <main>
    <section class="view" data-view="home"></section>
    <section class="view" data-view="sport" hidden></section>
    <section class="view" data-view="reminders" hidden></section>
  </main>

  <nav class="bottom-nav">
    <button data-go="home" class="on"><span>📅</span>Accueil</button>
    <button data-go="sport"><span>🏋️</span>Sport</button>
    <button data-go="reminders"><span>🔔</span>Rappels</button>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
